<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PontoView • Hora Exata</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pv-blue:#08479a;
      --pv-blue-deep:#063776;
      --pv-sky:#69cff2;
      --pv-white:#f8fbff;
      --pv-muted:rgba(248,251,255,.72);
      --pv-faint:rgba(248,251,255,.5);
      --accent-opacity:.22;
      --bg-top:#0a4b9f;
      --bg-bottom:#063b80;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      overflow:hidden;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--pv-white);
      background:
        radial-gradient(circle at 78% 20%, rgba(105,207,242,var(--accent-opacity)) 0 7%, transparent 26%),
        radial-gradient(circle at 18% 82%, rgba(105,207,242,.12) 0 6%, transparent 25%),
        linear-gradient(145deg,var(--bg-top),var(--bg-bottom));
      transition:background 1.2s ease;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      border-radius:999px;
      border:clamp(10px,1.1vw,18px) solid rgba(105,207,242,.2);
      pointer-events:none;
    }

    body::before{
      width:22vw;
      height:22vw;
      min-width:260px;
      min-height:260px;
      right:-8vw;
      top:-10vw;
      border-left-color:transparent;
      border-bottom-color:transparent;
      transform:rotate(24deg);
    }

    body::after{
      width:18vw;
      height:18vw;
      min-width:220px;
      min-height:220px;
      left:-7vw;
      bottom:-9vw;
      border-top-color:transparent;
      border-right-color:transparent;
      transform:rotate(18deg);
      opacity:.72;
    }

    .app{
      position:relative;
      z-index:1;
      height:100%;
      padding:clamp(28px,4vw,68px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .panel{
      width:min(1180px,94vw);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      opacity:0;
      transform:translateY(14px);
      animation:enter .9s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes enter{
      to{opacity:1;transform:translateY(0)}
    }

    .brand-mark{
      width:clamp(68px,6.6vw,94px);
      aspect-ratio:1;
      border-radius:28%;
      border:3px solid rgba(248,251,255,.94);
      position:relative;
      margin-bottom:clamp(24px,3vh,38px);
    }

    .brand-mark::before,
    .brand-mark::after{
      content:"";
      position:absolute;
      width:30%;
      height:30%;
      border:clamp(5px,.48vw,7px) solid var(--pv-sky);
      border-radius:50%;
      border-left-color:transparent;
      border-bottom-color:transparent;
    }

    .brand-mark::before{
      right:14%;
      top:13%;
      transform:rotate(8deg);
    }

    .brand-mark::after{
      left:13%;
      bottom:13%;
      transform:rotate(188deg);
    }

    .brand-mark span{
      position:absolute;
      width:34%;
      aspect-ratio:1;
      border-radius:50%;
      background:var(--pv-sky);
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }

    .date{
      font-size:clamp(17px,1.55vw,24px);
      font-weight:600;
      letter-spacing:.18em;
      color:var(--pv-muted);
      text-transform:uppercase;
      margin-bottom:clamp(12px,1.8vh,22px);
    }

    .time{
      font-size:clamp(118px,18vw,248px);
      font-weight:300;
      line-height:.9;
      letter-spacing:-.055em;
      color:var(--pv-white);
      font-variant-numeric:tabular-nums;
      text-shadow:0 1px 0 rgba(255,255,255,.06);
    }

    .divider{
      width:clamp(80px,8vw,120px);
      height:4px;
      border-radius:99px;
      background:var(--pv-sky);
      margin:clamp(20px,3vh,34px) auto clamp(14px,2vh,22px);
      opacity:.95;
    }

    .location{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      font-size:clamp(14px,1.35vw,20px);
      font-weight:500;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:var(--pv-muted);
    }

    .location .material-icons-outlined{
      font-size:1.15em;
      color:var(--pv-sky);
    }

    .brand{
      position:fixed;
      right:clamp(18px,2.5vw,42px);
      bottom:clamp(16px,2.4vw,34px);
      z-index:2;
      pointer-events:none;
      opacity:.82;
    }

    .brand img{
      display:block;
      width:auto;
      height:clamp(22px,2.2vw,32px);
      max-width:24vw;
      object-fit:contain;
      filter:brightness(0) invert(1);
    }

    @media (max-width:700px){
      .app{padding:24px 18px 66px}
      .brand-mark{border-radius:24%;margin-bottom:22px}
      .date{letter-spacing:.12em}
      .time{font-size:clamp(86px,25vw,150px)}
      .location{letter-spacing:.1em}
      .brand{right:14px;bottom:14px}
      .brand img{height:20px;max-width:34vw}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel" aria-label="Painel de horário">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div class="date" id="date">—</div>
      <div class="time" id="time">--:--</div>
      <div class="divider" aria-hidden="true"></div>
      <div class="location" aria-label="Localização aproximada por IP">
        <span class="material-icons-outlined" aria-hidden="true">location_on</span>
        <span id="city">Localizando…</span>
      </div>
    </section>
  </main>

  <div class="brand" aria-hidden="true">
    <img src="assets/logo.png" alt="">
  </div>

  <script>
    const weekday = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
    const month = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];

    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const cityEl = document.getElementById("city");

    function pad2(n){ return String(n).padStart(2,"0"); }

    function updateClock(){
      const d = new Date();
      timeEl.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      dateEl.textContent = `${weekday[d.getDay()]}, ${pad2(d.getDate())} DE ${month[d.getMonth()]}`;
    }

    (function startClock(){
      updateClock();
      const ms = 1000 - new Date().getMilliseconds();
      setTimeout(() => {
        updateClock();
        setInterval(updateClock,1000);
      },ms);
    })();

    function applyDayMoment(){
      const hour = new Date().getHours();
      const root = document.documentElement;

      if(hour >= 6 && hour < 12){
        root.style.setProperty("--bg-top","#0b55ad");
        root.style.setProperty("--bg-bottom","#08458f");
        root.style.setProperty("--accent-opacity",".28");
      }else if(hour >= 12 && hour < 18){
        root.style.setProperty("--bg-top","#084b9f");
        root.style.setProperty("--bg-bottom","#063b80");
        root.style.setProperty("--accent-opacity",".22");
      }else{
        root.style.setProperty("--bg-top","#063a7c");
        root.style.setProperty("--bg-bottom","#03275b");
        root.style.setProperty("--accent-opacity",".16");
      }
    }

    applyDayMoment();
    setInterval(applyDayMoment,10*60*1000);

    function fetchWithTimeout(url,opts={},timeoutMs=4500){
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      return fetch(url,{...opts,signal:ctrl.signal}).finally(() => clearTimeout(t));
    }

    function normStr(v){
      if(v == null) return null;
      const s = String(v).trim();
      return s ? s : null;
    }

    function toNum(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function getIpLocationRobust(){
      const providers = [
        async () => {
          const r = await fetchWithTimeout("https://ipwho.is/?lang=pt",{cache:"no-store"});
          const d = await r.json();
          if(!d || d.success === false) throw new Error("ipwho.is failed");
          return {
            city:normStr(d.city),
            region:normStr(d.region_code || d.region),
            country:normStr(d.country_code),
            lat:toNum(d.latitude),
            lon:toNum(d.longitude)
          };
        },
        async () => {
          const r = await fetchWithTimeout("https://ipapi.co/json/",{cache:"no-store"});
          const d = await r.json();
          return {
            city:normStr(d.city),
            region:normStr(d.region_code || d.region),
            country:normStr(d.country_code),
            lat:toNum(d.latitude),
            lon:toNum(d.longitude)
          };
        },
        async () => {
          const r = await fetchWithTimeout("https://geolocation-db.com/json/",{cache:"no-store"});
          const d = await r.json();
          return {
            city:normStr(d.city),
            region:normStr(d.state),
            country:normStr(d.country_code),
            lat:toNum(d.latitude),
            lon:toNum(d.longitude)
          };
        }
      ];

      let lastErr = null;
      for(const provider of providers){
        try{
          const loc = await provider();
          if(loc.city || (loc.lat != null && loc.lon != null)) return loc;
          lastErr = new Error("provider returned empty data");
        }catch(e){
          lastErr = e;
        }
      }
      throw lastErr || new Error("all providers failed");
    }

    function formatPlaceUpper(loc){
      const city = loc.city ? loc.city.toUpperCase() : null;
      const region = loc.region ? loc.region.toUpperCase() : null;
      const country = loc.country ? loc.country.toUpperCase() : null;

      if(city && region) return `${city} · ${region}`;
      if(city && country) return `${city} · ${country}`;
      if(city) return city;
      return "LOCAL NÃO IDENTIFICADO";
    }

    (async function loadCity(){
      try{
        const loc = await getIpLocationRobust();
        cityEl.textContent = formatPlaceUpper(loc);
      }catch{
        cityEl.textContent = "LOCAL NÃO IDENTIFICADO";
      }
    })();
  </script>
</body>
</html>
